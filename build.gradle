plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'org.jetbrains.kotlin.jvm' version '2.3.21'
}
group = 'dev.hybridlabs'
description = 'Hybrid Aquatic community port for Minecraft 26.3 / Fabric'
version = '1.7.4-port.4+26.3'
base.archivesName = 'hybrid-aquatic-fabric'
repositories {
    mavenCentral()
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url = 'https://api.modrinth.com/maven' }
}
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.164.0+26.3'
    implementation 'net.fabricmc:fabric-language-kotlin:1.13.11+kotlin.2.3.21'
    implementation 'com.geckolib:geckolib-fabric-26.3:5.5.7'
    implementation project(':hapi')
    implementation 'maven.modrinth:lithostitched:2.0.6-fabric-26.3'
    compileOnly 'maven.modrinth:trinkets-updated:4.2.1+26.3'
    runtimeOnly 'maven.modrinth:trinkets-updated:4.2.1+26.3'
}
sourceSets.main {
    java.srcDirs = ['common/src/main/java', 'fabric/src/main/java']
    java.exclude 'dev/hybridlabs/aquatic/data/**'
    kotlin.srcDirs = ['common/src/main/kotlin', 'fabric/src/main/kotlin', 'common/src/main/java', 'fabric/src/main/java']
    kotlin.exclude 'dev/hybridlabs/aquatic/data/**'
    resources.srcDirs = ['common/src/main/resources', 'fabric/src/main/resources', 'fabric/src/generated/resources']
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
kotlin { jvmToolchain(25) }
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000']
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version, description: project.description ?: '', mod_id: 'hapi', mod_name: 'Hybrid API'
    }
}
jar { from('LICENSE') }
loom { accessWidenerPath = file('fabric/src/main/resources/hybrid_aquatic.accesswidener') }

// Validate the feature codec bridge independently while the full port is in progress.
sourceSets {
    portTest {
        java.srcDirs = ['src/portTest/java', 'common/src/main/java']
        java.include 'dev/hybridlabs/aquatic/world/gen/feature/**', 'dev/hybridlabs/aquatic/access/CustomPlayerEntityData.java'
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += compileClasspath
    }
}
tasks.register('runPortFeatureTest', JavaExec) {
    dependsOn tasks.named('portTestClasses')
    classpath = sourceSets.portTest.runtimeClasspath
    mainClass = 'dev.hybridlabs.aquatic.world.gen.feature.FeatureCodecTest'
    workingDir = layout.buildDirectory.dir('portTest')
    doFirst { workingDir.mkdirs() }
}

fabricApi.configureTests {
    createSourceSet = true
    modId = 'hybrid_aquatic_port_test'
    enableGameTests = true
    enableClientGameTests = true
    eula = true
}

// A local install bundle with the exact runtime dependencies used by the port tests.
tasks.register('portBundle', Zip) {
    dependsOn tasks.named('jar'), project(':hapi').tasks.named('jar')
    archiveFileName = 'hybrid-aquatic-26.3-fabric-port.4.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    into('mods') {
        from tasks.named('jar').flatMap { it.archiveFile }
        from project(':hapi').tasks.named('jar').flatMap { it.archiveFile }
        from {
            configurations.runtimeClasspath.files.findAll { file ->
                ['fabric-api-0.', 'fabric-language-kotlin-', 'geckolib-fabric-26.3-',
                 'lithostitched-', 'trinkets-updated-'].any { file.name.startsWith(it) } && file.name.endsWith('.jar')
            }
        }
    }
    from 'PORT-INSTALL.txt'
    from('LICENSE') { into 'licenses/hybrid-aquatic' }
    from('hybrid-api/LICENSE') { into 'licenses/hybrid-api' }
}
